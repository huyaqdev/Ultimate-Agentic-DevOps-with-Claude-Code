name: Deploy

on:
  push:
    branches: [main]

# Required for OIDC token exchange
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::144084517905:role/demo-site-production-github-actions
          aws-region: us-east-1

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://demo-site-production-site \
            --exclude "terraform/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude ".claude/*" \
            --exclude ".cursor/*" \
            --exclude ".mcp.json" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3MB1RBYOZZ4PH \
            --paths "/*"
